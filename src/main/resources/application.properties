spring.application.name=tms-backend
spring.info

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tms_backend}
spring.datasource.username=${DB_USERNAME:tms}
spring.datasource.password=${DB_PASSWORD:tms}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns the schema (see src/main/resources/db/migration) — Hibernate only validates against it
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Email (SMTP) — SMTP_USERNAME/SMTP_PASSWORD authenticate against the relay;
# SMTP_FROM_ADDRESS is the mailbox address that appears in the From header, which
# is NOT necessarily the same as SMTP_USERNAME (many relays use an API-style
# token as the username, which is not a valid address on its own)
spring.mail.host=smtp.emailsbit.com
spring.mail.port=505
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Reminder email dispatch
app.mail.reminders.enabled=${REMINDER_EMAILS_ENABLED:true}
app.mail.reminders.from=${SMTP_FROM_ADDRESS:}
app.mail.reminders.dispatch-interval-ms=${REMINDER_DISPATCH_INTERVAL_MS:60000}

# JWT auth — HS256 requires a secret >= 256 bits (32 bytes); the default below is dev-only, override in prod
app.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me-please-32bytes+}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}